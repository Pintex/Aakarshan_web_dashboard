<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalable Control Dashboard</title>
    <!-- Dynamic link to your CSS rendering configurations -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard-container">
        <h1>System Control Unit</h1>
        <p class="subtitle">A modular frontend sandbox framework</p>

        <!-- Metric Display Readout (Analog Data Simulation) -->
        <section class="readout-box">
            <span class="label">Interrupt Counter:</span>
            <span id="counter-display" class="value">0</span>
        </section>

        <!-- Interactive Peripheral Components -->
        <div class="control-actions">
            <button id="increment-btn" class="btn primary">Trigger Signal</button>
            <button id="reset-btn" class="btn secondary">Reset State</button>
        </div>
    </main>

    <!-- Dynamic link to your JavaScript execution logic -->
    <script src="app.js"></script>
</body>
</html>
